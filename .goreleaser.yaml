version: 2

project_name: pve-rook-secret-sync

builds:
  - id: pve-rook-secret-sync
    main: .
    binary: pve-rook-secret-sync
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w

archives:
  - ids:
      - pve-rook-secret-sync
    formats:
      - tar.gz
    files:
      - README.md
      - config.example.json

nfpms:
  - id: deb
    package_name: pve-rook-secret-sync
    ids:
      - pve-rook-secret-sync
    vendor: Son Roy Almerol
    homepage: https://github.com/sonroyaalmerol/pve-rook-secret-sync
    maintainer: Son Roy Almerol <sralmerol@sgl.com>
    description: Synchronize PVE Ceph credentials and metadata to Vault for Rook
    formats:
      - deb
    bindir: /usr/sbin
    contents:
      - src: config.example.json
        dst: /etc/pve-rook-secret-sync/config.json
        type: config|noreplace
        file_info:
          mode: 0600
      - src: packaging/pve-rook-secret-sync.env
        dst: /etc/default/pve-rook-secret-sync
        type: config|noreplace
        file_info:
          mode: 0600
      - src: packaging/pve-rook-secret-sync.service
        dst: /lib/systemd/system/pve-rook-secret-sync.service
      - src: packaging/pve-rook-secret-sync.timer
        dst: /lib/systemd/system/pve-rook-secret-sync.timer
      - src: README.md
        dst: /usr/share/doc/pve-rook-secret-sync/README.md

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
